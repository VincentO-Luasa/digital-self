[project]
name = "local-brain"
version = "0.1.0"
description = "A local AI second brain: markdown knowledge graph, human-like memory, escalation to a big model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "openai>=1.50",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.8",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "numpy>=2.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pypdf>=5.0",
]

[project.scripts]
brain = "brain.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: needs the local model server running"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
